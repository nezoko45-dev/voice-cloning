<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatGPT Voice Loop</title>
<style>
:root{color-scheme:dark}body{font:14px/1.45 system-ui,sans-serif;background:#171717;color:#f4f4f4;width:280px;margin:0;padding:16px}h1{font-size:16px;margin:0 0 12px}label{display:flex;gap:10px;align-items:center;margin:12px 0}input[type=checkbox]{width:17px;height:17px;accent-color:#10a37f}input[type=number]{width:66px;padding:6px;background:#262626;color:white;border:1px solid #555;border-radius:6px}button{width:100%;padding:9px;border:0;border-radius:8px;background:#10a37f;color:white;font-weight:700;cursor:pointer;margin-top:10px}p{color:#b9b9b9;font-size:12px}.status{min-height:18px;color:#a7e4ce}
</style>
</head>
<body>
<h1>ChatGPT Voice Loop</h1>
<label><input id="enabled" type="checkbox"> Enable automatic voice loop</label>
<label for="silence">Stop after silence (seconds)</label>
<input id="silence" type="number" min="1" max="10" step="0.5" value="2.5">
<button id="save">Save settings</button>
<p id="status" class="status"></p>
<p>When enabled on ChatGPT: start Dictate → stop after a pause → Send → Read aloud. Keep the ChatGPT tab open. Review the transcript before relying on it for important messages.</p>
<script src="popup.js"></script>
</body>
</html>
